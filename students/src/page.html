<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f1">
  <meta name="description" content="دليل نيستات للطلاب لاختيار الأسلوب الإحصائي خطوة بخطوة، بالعربية والإنجليزية.">
  <title>نيستات | دليل الطالب للتحليل الإحصائي</title>
  <style>
{{STYLES}}
  </style>
</head>
<body>
  <a id="skip" class="skip-link" href="#main-content">انتقل إلى الدليل</a>
  <header class="topbar">
    <div class="wrap nav">
      <a class="brand" id="home" href="#ar" aria-label="نيستات | البداية">
        <span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="wordmark" lang="en" dir="ltr">Nistat<span>.</span></span>
      </a>
      <span class="product-label" id="product-label">دليل الطالب</span>
      <div class="nav-actions">
        <a id="language" class="nav-button" href="#en" lang="en">English</a>
        <button id="share" class="nav-button share" type="button">نسخ الرابط</button>
      </div>
    </div>
  </header>
  <main id="main-content" class="wrap" tabindex="-1">
    <div id="intro" class="intro">
      <h1 id="page-heading">دليل اختيار التحليل الإحصائي</h1>
      <p id="intro-text">ابدأ بسؤالك البحثي، ثم حدّد تصميم دراستك للوصول إلى الأسلوب المناسب وما تحتاج إلى فحصه وتقريره.</p>
    </div>
    <noscript><p class="panel">يتطلب الدليل تفعيل JavaScript في المتصفح. Enable JavaScript to use the student guide.</p></noscript>
    <div class="workspace">
      <section id="guide-panel" class="panel guide-panel" aria-labelledby="question-title"></section>
      <aside id="side-panel" class="side-panel"></aside>
    </div>
  </main>
  <footer class="wrap footer">
    <span id="footer-name">Nistat · دليل الطالب</span>
    <nav aria-label="روابط الدليل" id="footer-nav">
      <a id="download" href="Nistat-Students.zip" download="Nistat-Students.zip">تنزيل نسخة دون اتصال (ZIP)</a>
      <span aria-hidden="true">·</span>
      <a id="repository" href="https://github.com/Nistat77/Nistat" target="_blank" rel="noopener noreferrer">المشروع على GitHub</a>
    </nav>
  </footer>
  <div id="notice" class="notice" role="status"></div>
  <dialog id="copy-dialog" aria-labelledby="copy-title">
    <h2 id="copy-title"></h2>
    <textarea id="manual-copy" dir="ltr" readonly aria-labelledby="copy-title"></textarea>
    <button id="close-dialog" type="button" class="button-solid"></button>
  </dialog>
  <script id="catalog" type="application/json">
{{CATALOG}}
  </script>
  <script>
{{ROUTES}}
{{APP}}
  </script>
</body>
</html>
